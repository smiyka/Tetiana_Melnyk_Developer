<a class="skip-link" href="#main-content" (click)="skip($event)">Skip to content</a>
<header class="topbar">
  <a class="brand" routerLink="/" aria-label="Tetiana Melnyk home"><span class="brand-mark" aria-hidden="true">TM</span><span class="brand-name">Tetiana Melnyk<span class="version">Software Developer</span></span></a>
  <nav aria-label="Main navigation">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" ariaCurrentWhenActive="page">Home</a>
    <a routerLink="/cv" routerLinkActive="active" ariaCurrentWhenActive="page">My CV</a>
    <a routerLink="/lab" routerLinkActive="active" ariaCurrentWhenActive="page">Developer Lab</a>
    <a routerLink="/games" routerLinkActive="active" ariaCurrentWhenActive="page">Games</a>
  </nav>
  <div class="theme-switch" role="group" aria-label="Color theme">
    <button type="button" [attr.aria-pressed]="theme() === 'light'" (click)="setTheme('light')"><span aria-hidden="true">☀</span> Light</button>
    <button type="button" [attr.aria-pressed]="theme() === 'dark'" (click)="setTheme('dark')"><span aria-hidden="true">☾</span> Dark</button>
  </div>
</header>
<main #main id="main-content" tabindex="-1"><router-outlet (activate)="onPageChange()" /></main>
<footer><a class="brand" routerLink="/">Tetiana Melnyk<span class="version">Developer Portfolio</span></a><a href="https://github.com/smiyka/Tetiana_Melnyk_Developer">Explore the source ↗</a></footer>
